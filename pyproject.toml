[project]
name = "adaptive-cua"
version = "0.1.0"
description = "Adaptive state representations for computer-use agents (6.1850 project)"
readme = "README.md"
authors = [
    { name = "Stanley", email = "stanleyhzhao@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.51.0",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
adaptive-cua = "src.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "src"
module-root = ""
