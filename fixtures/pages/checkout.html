<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checkout</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 40px; color: #222; }
    form { display: grid; gap: 12px; max-width: 360px; }
    label { display: grid; gap: 4px; font-size: 14px; }
    input, select { padding: 8px; font-size: 14px; }
    button { padding: 10px; font-size: 15px; background: #1d4ed8; color: white; border: 0; border-radius: 6px; }
    #status { margin-top: 16px; font-weight: 600; }
    .hidden-promo { display: none; }
  </style>
</head>
<body>
  <h1>Checkout</h1>
  <p class="hidden-promo">Secret promo code: SAVE50</p>
  <form id="checkout">
    <label>Full name <input id="name" name="name" required></label>
    <label>Email <input id="email" name="email" type="email" required></label>
    <!-- No label: only a placeholder names this field. -->
    <input id="zip" name="zip" placeholder="ZIP code" required>
    <label>Shipping
      <select id="shipping" name="shipping">
        <option value="standard">Standard (5-7 days)</option>
        <option value="express">Express (1-2 days)</option>
      </select>
    </label>
    <button type="submit">Place order</button>
  </form>
  <div id="status" role="status"></div>
  <script>
    document.getElementById('checkout').addEventListener('submit', (e) => {
      e.preventDefault();
      const d = new FormData(e.target);
      document.getElementById('status').textContent =
        `Order placed for ${d.get('name')} (${d.get('shipping')})`;
    });
  </script>
</body>
</html>
